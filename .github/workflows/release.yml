name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2-alpine
        ports:
          - 4222:4222
      rabbitmq:
        image: rabbitmq:4-alpine
        ports:
          - 5672:5672
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches crate version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "qanat-routing") | .version')"

          if [[ "$tag_version" != "$crate_version" ]]; then
            echo "Tag version '$tag_version' does not match crate version '$crate_version'."
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-features --all-targets -- -D warnings

      - name: Wait for broker services
        shell: bash
        run: |
          for port in 4222 5672 6379; do
            ready=false
            for _ in {1..30}; do
              if (echo >"/dev/tcp/127.0.0.1/$port") 2>/dev/null; then
                ready=true
                break
              fi
              sleep 1
            done

            if [[ "$ready" != true ]]; then
              echo "Broker service on port $port did not become ready."
              exit 1
            fi
          done

      - name: Run core tests
        run: cargo test --locked --features axum,cbor,msgpack -- --test-threads=1

      - name: Run NATS tests
        run: cargo test --locked --features nats bus::nats_bus::tests -- --test-threads=1

      - name: Run NNG tests
        run: cargo test --locked --features nng tests::nng_tests -- --test-threads=1

      - name: Run RabbitMQ tests
        run: cargo test --locked --features rabbitmq bus::rabbitmq_bus::tests -- --test-threads=1

      - name: Run Redis tests
        run: cargo test --locked --features redis bus::redis_bus::tests -- --test-threads=1

      - name: Verify package
        run: cargo package --locked

  publish:
    name: Publish crate
    needs: verify
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=("$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
